<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiftMonitor</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b0914;
 color:white;
 font-family:Arial,sans-serif;
 padding:22px;
}

header{display:flex;align-items:center;gap:12px}
.logo{font-size:35px}
h1{font-size:25px;margin:0}
.sub{color:#aaa;font-size:13px;margin-top:5px}

.card{
 background:#171326;
 border:1px solid #30244b;
 border-radius:17px;
 padding:18px;
 margin-top:20px;
}

h2{font-size:18px;margin:0 0 14px}

input{
 width:100%;
 padding:14px;
 border-radius:10px;
 background:#0d0a18;
 border:1px solid #40315c;
 color:white;
 font-size:15px;
 outline:none;
}

button{
 width:100%;
 padding:14px;
 border:0;
 border-radius:10px;
 background:#874cff;
 color:white;
 font-weight:bold;
 font-size:15px;
 margin-top:12px;
 cursor:pointer;
}

.stats{display:flex;gap:10px}
.stat{
 flex:1;
 background:#211a35;
 padding:14px;
 border-radius:12px;
}

.number{
 font-size:23px;
 font-weight:bold;
 color:#b68cff;
}

.small{font-size:12px;color:#aaa;margin-top:5px}
.gift{border-top:1px solid #30244b;padding:14px 0}
.empty{color:#aaa;font-size:13px;text-align:center;padding:15px}
nav{display:flex;justify-content:space-around;margin-top:25px;color:#aaa}
nav span{font-size:12px;text-align:center}
</style>
</head>

<body>

<header>
 <div class="logo">🎁</div>
 <div>
  <h1>GiftMonitor</h1>
  <div class="sub">Telegram Gift Tracker</div>
 </div>
</header>

<div class="card">
 <h2>⚡ Мониторинг подарков</h2>
 <div class="stats">
  <div class="stat">
   <div class="number" id="total">0</div>
   <div class="small">Найдено событий</div>
  </div>
  <div class="stat">
   <div class="number" id="status">...</div>
   <div class="small">Статус приложения</div>
  </div>
 </div>
</div>

<div class="card">
 <h2>🔍 Поиск подарка</h2>
 <input id="search" placeholder="Введи название или ID подарка">
 <button onclick="searchGift()">Найти подарок</button>
 <div id="results" class="empty">
  Ожидание данных мониторинга...
 </div>
</div>

<div class="card">
 <h2>🆕 Последние улучшения</h2>
 <div id="latest" class="empty">
  Подключение к API...
 </div>
</div>

<div class="card">
 <h2>👑 Premium</h2>
 <p class="sub">Расширенный мониторинг и уведомления</p>
 <button onclick="alert('Premium скоро появится!')">
  Подробнее о Premium
 </button>
</div>

<nav>
 <span>🏠<br>Главная</span>
 <span>🔍<br>Поиск</span>
 <span>🔔<br>Уведомления</span>
 <span>👤<br>Профиль</span>
</nav>

<script>
const API = "https://api.changes.tg/changes";
 document.getElementById("status").textContent = "JS WORKS";

let gifts = [];
let cursor = "0";
let loading = false;

function escapeHTML(value) {
 return String(value ?? "").replace(/[&<>"']/g, function(c) {
  return {
   "&": "&amp;",
   "<": "&lt;",
   ">": "&gt;",
   '"': "&quot;",
   "'": "&#39;"
  }[c];
 });
}

function getTime(value) {
 const date = new Date(value);
 return Number.isNaN(date.getTime())
  ? "Время неизвестно"
  : date.toLocaleString("ru-RU");
}

function renderGifts() {
 const latest = document.getElementById("latest");
 const total = document.getElementById("total");

 gifts.sort(function(a, b) {
  return new Date(b.at) - new Date(a.at);
 });

 total.textContent = gifts.length;

 if (gifts.length === 0) {
  latest.textContent = "Подходящих событий пока нет.";
  return;
 }

 latest.innerHTML = gifts.slice(0, 50).map(function(g) {
  let item = "Улучшение подарка";

  if (g.type === "model.rarity_changed") {
   item = "Модель: " + (g.model || "Неизвестно");
  }

  if (g.type === "backdrop.rarity_changed") {
   item = "Фон: " + (g.backdrop || "Неизвестно");
  }

  if (g.type === "symbol.rarity_changed") {
   item = "Символ: " + (g.symbol || "Неизвестно");
  }

  return `
   <div class="gift">
    <strong>${escapeHTML(g.gift || "Неизвестный подарок")}</strong>
    <div class="small">ID: ${escapeHTML(g.giftId || "—")}</div>
    <div>${escapeHTML(item)}</div>
    <div class="small">${escapeHTML(getTime(g.at))}</div>
   </div>
  `;
 }).join("");
}

async function searchGift() {
 const query = document.getElementById("search").value.toLowerCase().trim();
 const results = document.getElementById("results");

 if (!query) {
  results.textContent = "Введи название или ID подарка.";
  return;
 }

 const found = gifts.filter(function(g) {
  return String(g.gift  "").toLowerCase().includes(query) 
   String(g.giftId || "").includes(query);
 });

 if (found.length === 0) {
  results.textContent = "Подарок не найден.";
  return;
 }

 results.textContent = "Загружаю информацию о подарках...";

 const uniqueGifts = [];
 const seen = new Set();

 found.forEach(function(g) {
  const id = g.giftId || g.gift;

  if (!seen.has(id)) {
   seen.add(id);
   uniqueGifts.push(g);
  }
 });

 function showVariants(items) {
  if (!Array.isArray(items) || items.length === 0) {
   return "Нет данных";
  }

  return items.slice(0, 10).map(function(item) {
   const rarity = item.rarity != null
    ? Number(item.rarity)
    : Number(item.rarityPermille || 0) / 10;

   return "<div class='small'>• " +
    escapeHTML(item.name || "Без названия") +
    " — " + (Number.isFinite(rarity) ? rarity.toFixed(1) : "—") +
    "%</div>";
  }).join("") +
   (items.length > 10
    ? "<div class='small'>И ещё " + (items.length - 10) + " вариантов...</div>"
    : "");
 }

 const cards = await Promise.all(uniqueGifts.map(async function(g) {
  try {
   const response = await fetch(
    "https://api.changes.tg/gift/" + encodeURIComponent(g.gift)
   );

   if (!response.ok) {
    throw new Error("API error: " + response.status);
   }

   const data = await response.json();

   return `
    <div class="gift">
     <strong>${escapeHTML(g.gift || "Неизвестный подарок")}</strong>
     <div class="small">ID: ${escapeHTML(g.giftId || "—")}</div>
     <div class="small">Последнее событие: ${escapeHTML(getTime(g.at))}</div>

     <hr>

     <strong>🎨 Модели (${(data.models || []).length})</strong>
     ${showVariants(data.models)}

     <br>
     <strong>🖼 Фоны (${(data.backdrops || []).length})</strong>
     ${showVariants(data.backdrops)}

     <br>
     <strong>🔣 Символы (${(data.symbols || []).length})</strong>
     ${showVariants(data.symbols)}
    </div>
   `;
  } catch (error) {
   console.error(error);

   return `
    <div class="gift">
     <strong>${escapeHTML(g.gift || "Неизвестный подарок")}</strong>
     <div class="small">Не удалось загрузить подробную информацию.</div>
    </div>
   `;
  }
 }));

 results.innerHTML = cards.join("");
}

async function loadGifts() {
 if (loading) return;

 loading = true;

 const status = document.
</script>
</body>
</html>
