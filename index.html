<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiftMonitor</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0914;color:white;
 font-family:Arial,sans-serif;padding:22px;
}
header{display:flex;align-items:center;gap:12px}
.logo{font-size:35px}
h1{font-size:25px;margin:0}
.sub{color:#aaa;font-size:13px;margin-top:5px}
.card{
 background:#171326;border:1px solid #30244b;
 border-radius:17px;padding:18px;margin-top:20px;
}
h2{font-size:18px;margin:0 0 14px}
input{
 width:100%;padding:14px;border-radius:10px;
 background:#0d0a18;border:1px solid #40315c;
 color:white;font-size:15px;outline:none;
}
button{
 width:100%;padding:14px;border:0;border-radius:10px;
 background:#874cff;color:white;font-weight:bold;
 font-size:15px;margin-top:12px;cursor:pointer;
}
.stats{display:flex;gap:10px}
.stat{flex:1;background:#211a35;padding:14px;border-radius:12px}
.number{font-size:23px;font-weight:bold;color:#b68cff}
.small{font-size:12px;color:#aaa;margin-top:5px}
.gift{border-top:1px solid #30244b;padding:14px 0}
.empty{color:#aaa;font-size:13px;text-align:center;padding:15px}
nav{display:flex;justify-content:space-around;margin-top:25px;color:#aaa}
nav span{font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
<div class="logo">🎁</div>
<div>
<h1>GiftMonitor</h1>
<div class="sub">Telegram Gift Tracker</div>
</div>
</header>

<div class="card">
<h2>⚡ Мониторинг подарков</h2>
<div class="stats">
<div class="stat">
<div class="number" id="total">0</div>
<div class="small">Найдено подарков</div>
</div>
<div class="stat">
<div class="number">ON</div>
<div class="small">Статус приложения</div>
</div>
</div>
</div>

<div class="card">
<h2>🔍 Поиск подарка</h2>
<input id="search" placeholder="Введи название или ID подарка">
<button onclick="searchGift()">Найти подарок</button>
<div id="results" class="empty">
Ожидание данных мониторинга...
</div>
</div>

<div class="card">
<h2>🆕 Последние улучшения</h2>
<div id="latest" class="empty">
Пока нет найденных подарков
</div>
</div>

<div class="card">
<h2>👑 Premium</h2>
<p class="sub">Расширенный мониторинг и уведомления</p>
<button onclick="alert('Premium скоро появится!')">
Подробнее о Premium
</button>
</div>

<nav>
<span>🏠<br>Главная</span>
<span>🔍<br>Поиск</span>
<span>🔔<br>Уведомления</span>
<span>👤<br>Профиль</span>
</nav>
<script>
const API = "https://api.changes.tg/changes";

let gifts = [];
let cursor = String(Date.now() - 30 * 24 * 60 * 60 * 1000);
let loading = false;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function getTimestamp(value) {
  if (value == null) return 0;

  let n = Number(value);

  if (Number.isFinite(n)) {
    return n < 100000000000 ? n * 1000 : n;
  }

  const parsed = new Date(value).getTime();
  return Number.isFinite(parsed) ? parsed : 0;
}

function getTime(value) {
  const timestamp = getTimestamp(value);

  return timestamp
    ? new Date(timestamp).toLocaleString("ru-RU")
    : "Время неизвестно";
}

function renderGifts() {
   const latest = document.getElementById("latest");
   const total = document.getElementById("total");
 
   const upgrades = gifts
     .sort((a, b) => getTimestamp(b.at) - getTimestamp(a.at));
   total.textContent = upgrades.length;
 
   if (!upgrades.length) {
     latest.textContent = "Пока изменений не найдено";
     return;
   }
 
   latest.innerHTML = upgrades.slice(0, 30).map((g, index) => {
     let item = "Неизвестный элемент";
    
     if (g.type === "model.rarity_changed") item = "Модель: " + (g.model || "Неизвестно");
     if (g.type === "backdrop.rarity_changed") item = "Фон: " + (g.backdrop || "Неизвестно");
     if (g.type === "symbol.rarity_changed") item = "Символ: " + (g.symbol || "Неизвестно");

     return `
       <div class="gift">
         <b>￼{escapeHTML(g.gift || "Неизвестный подарок")}</b>
         <div class="small">ID: ${escapeHTML(g.giftId || "Нет данных")}</div>
         <div class="small">${escapeHTML(item)}</div>
         <div class="small">Редкость: ${escapeHTML(g.fromPermille)} → ${escapeHTML(g.toPermille)}</div>
         <div class="small">Время: ${escapeHTML(getTime(g.at))}</div>
         ${index === 0 ? '<div class="small">⚡ Последнее изменение</div>' : ""}
       </div>
     `;
   }).join("");
 }

  latest.innerHTML = upgrades.slice(0, 30).map((g, index) => `
    <div class="gift">
      <b>${index === 0 ? "🆕 " : "🎁 "}${escapeHTML(g.gift || "Неизвестный подарок")}</b>
      <div class="small">ID подарка: ${escapeHTML(g.giftId || "Нет данных")}</div>
      <div class="small">Время: ${escapeHTML(getTime(g.at))}</div>
      ${index === 0 ? '<div class="small">⚡ Последнее улучшение</div>' : ""}
    </div>
  `).join("");
}

async function loadGifts() {
  if (loading) return;

  loading = true;

  try {
    const url = API + "?since=" +
      encodeURIComponent(cursor) + "&limit=1000";

    const response = await fetch(url);

    if (!response.ok) {
      throw new Error("Ошибка API: " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.events)) {
      throw new Error("Неожиданный формат API");
    }

    for (const event of data.events) {
      if (
        event.type === "model.rarity_changed" ||
        event.type === "backdrop.rarity_changed" ||
        event.type === "symbol.rarity_changed"
      ) {
        gifts.push(event);
      }
    }

    if (data.next) {
      cursor = String(data.next);
    }

    const unique = new Map();

    for (const g of gifts) {
      const key = g.id != null
        ? String(g.id)
        : ${g.giftId}-${g.at}-${g.gift};

      unique.set(key, g);
    }

    gifts = [...unique.values()];

    renderGifts();

  } catch (error) {
    console.error(error);

    document.getElementById("latest").textContent =
      "Не удалось получить данные API. Проверь подключение.";

  } finally {
    loading = false;
  }
}

function searchGift() {
  const query = document.getElementById("search")
    .value.trim().toLowerCase();

  const results = document.getElementById("results");

  if (!query) {
    results.textContent = "Введи название или ID подарка.";
    return;
  }

  const found = gifts.filter(g =>
    String(g.gift  "").toLowerCase().includes(query) 
    String(g.giftId || "").toLowerCase().includes(query)
  ).sort((a, b) => getTimestamp(b.at) - getTimestamp(a.at));

  if (!found.length) {
    results.textContent = "Совпадений нет среди загруженных событий.";
    return;
  }

  results.innerHTML = found.map(g => `
    <div class="gift">
      <b>🎁 ${escapeHTML(g.gift || "Неизвестный подарок")}</b>
      <div class="small">ID: ${escapeHTML(g.giftId || "Нет данных")}</div>
      <div class="small">${escapeHTML(getTime(g.at))}</div>
    </div>
  `).join("");
}

loadGifts();
setInterval(loadGifts, 30000);
</script>
</body>
</html>
